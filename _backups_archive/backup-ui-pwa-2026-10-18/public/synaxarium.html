<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السنكسار الكنسي وسير القديسين</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; color: #1e293b; padding-bottom: 50px; }
        .main-card { max-width: 860px; margin: 20px auto; background: #ffffff; border-radius: 22px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .date-box { background: #f1f5f9; border-radius: 16px; padding: 16px; margin-bottom: 20px; }
        .saint-card { border-radius: 16px; border: 1px solid #e2e8f0; background: #ffffff; padding: 22px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); border-right: 5px solid #b91c1c; }
        .saint-title { color: #b91c1c; font-weight: 800; font-size: 1.25rem; border-bottom: 2px solid #fee2e2; padding-bottom: 10px; margin-bottom: 15px; }
        .saint-story { line-height: 2.3; font-size: 1.15rem; color: #334155; text-align: justify; }
    </style>
</head>
<body>

<div class="container pb-5">
    <div class="main-card">
        <!-- ترويسة الصفحة -->
        <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-3 flex-wrap gap-2">
            <a href="#" onclick="goBack(event)" class="btn btn-outline-secondary btn-sm fw-bold"><i class="fa-solid fa-arrow-right me-1"></i> العودة للرئيسية</a>
            <h4 class="fw-bold mb-0 text-danger"><i class="fa-solid fa-scroll me-2"></i>السنكسار الكنسي</h4>
            <span id="copticDateBadge" class="badge bg-danger fs-6 px-3 py-2">جاري الحساب...</span>
        </div>

        <!-- حقل اختيار والبحث في التاريخ -->
        <div class="date-box">
            <div class="row g-2 align-items-center">
                <div class="col-md-6">
                    <label class="form-label small fw-bold text-muted">اختر تاريخاً لعرض سنكساره:</label>
                    <input type="date" id="synaxDateInput" class="form-control fw-bold text-center" onchange="fetchSynaxariumForDate(this.value)">
                </div>
                <div class="col-md-6 d-flex align-items-end mt-2 mt-md-0 gap-2">
                    <button class="btn btn-danger w-100 fw-bold py-2" onclick="setTodayDate()">
                        <i class="fa-solid fa-calendar-day me-1"></i> سنكسار اليوم الحالي
                    </button>
                    <a href="https://st-takla.org/Fehris-00-Index-pages/Fehres-02-Coptic-Synaxarium.html" target="_blank" rel="noopener noreferrer" class="btn btn-outline-danger fw-bold py-2 text-nowrap" title="فتح أنبا تكلا">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- حاوية عرض قصص وتذكارات القديسين -->
        <div id="synaxariumContainer">
            <div class="text-center py-5 text-muted">
                <div class="spinner-border text-danger mb-3" role="status"></div>
                <div>جاري جلب سير قديسي هذا اليوم...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const CONFIG = {
        apiUrl: 'https://api.katameros.app',
        languageId: 3,
        calendar: 'gregorian'
    };

    function formatDateForApi(dateObj) {
        const d = dateObj.getDate().toString().padStart(2, '0');
        const m = (dateObj.getMonth() + 1).toString().padStart(2, '0');
        const y = dateObj.getFullYear();
        return `${d}-${m}-${y}`;
    }

    function convertToCoptic(dateObj) {
        try {
            const str = new Intl.DateTimeFormat('ar-EG-u-ca-coptic', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            }).format(dateObj);
            return str.replace(' ERA1', '').trim();
        } catch (e) {
            return "تاريخ قبطي";
        }
    }

    async function fetchSynaxariumForDate(dateStr) {
        const container = document.getElementById('synaxariumContainer');
        container.innerHTML = `
            <div class="text-center py-5 text-muted">
                <div class="spinner-border text-danger mb-3" role="status"></div>
                <div>جاري تحميل سنكسار اليوم...</div>
            </div>`;

        const targetDate = new Date(dateStr);
        document.getElementById('copticDateBadge').textContent = convertToCoptic(targetDate);

        const dateParam = formatDateForApi(targetDate);

        try {
            const url = `${CONFIG.apiUrl}/readings/${CONFIG.calendar}/${dateParam}?languageId=${CONFIG.languageId}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error('فشل جلب البيانات');

            const data = await response.json();
            renderSynaxarium(data);
        } catch (error) {
            console.error(error);
            container.innerHTML = `
                <div class="alert alert-warning text-center p-4">
                    <i class="fa-solid fa-triangle-exclamation fs-3 mb-2 d-block text-warning"></i>
                    <strong>تعذر جلب السنكسار الحالي</strong><br>
                    <small class="text-muted">يرجى التحقق من اتصال الإنترنت والمحاولة مرة أخرى.</small><br>
                    <button class="btn btn-outline-danger btn-sm mt-3 fw-bold" onclick="fetchSynaxariumForDate('${dateStr}')">
                        <i class="fa-solid fa-rotate-right me-1"></i> إعادة المحاولة
                    </button>
                </div>`;
        }
    }

    function renderSynaxarium(data) {
        const container = document.getElementById('synaxariumContainer');
        container.innerHTML = '';

        if (!data || !data.sections) return;

        // استخراج قسم السنكسار المخصص من استجابة الـ API
        let synaxReadings = [];
        data.sections.forEach(sec => {
            if (sec.subSections) {
                sec.subSections.forEach(sub => {
                    if (sub.title && (sub.title.includes("السنكسار") || sub.title.includes("سنكسار"))) {
                        if (sub.readings) synaxReadings.push(...sub.readings);
                    }
                });
            }
        });

        // إذا لم يُوجد قسم منفصل، نبحث في كل القراءات عن نص السنكسار
        if (synaxReadings.length === 0) {
            data.sections.forEach(sec => {
                if (sec.subSections) {
                    sec.subSections.forEach(sub => {
                        if (sub.readings) {
                            sub.readings.forEach(r => {
                                if (r.title && r.title.includes("سنكسار")) {
                                    synaxReadings.push(r);
                                }
                            });
                        }
                    });
                }
            });
        }

        if (synaxReadings.length === 0) {
            container.innerHTML = `
                <div class="text-center py-5 text-muted">
                    <i class="fa-solid fa-circle-info fs-3 mb-2 d-block"></i>
                    لا توجد تذكارات مسجلة للسنكسار في هذا اليوم.
                </div>`;
            return;
        }

        synaxReadings.forEach(reading => {
            const title = reading.title || "تذكار قديس اليوم";
            let content = "";

            if (reading.html) {
                content = reading.html;
            } else if (reading.passages) {
                reading.passages.forEach(p => {
                    if (p.verses) {
                        p.verses.forEach(v => {
                            content += `${v.text} `;
                        });
                    }
                });
            }

            if (!content.trim()) return;

            const card = document.createElement('div');
            card.className = 'saint-card shadow-sm';
            card.innerHTML = `
                <h5 class="saint-title"><i class="fa-solid fa-cross me-1"></i> ${title}</h5>
                <div class="saint-story">${content}</div>
            `;
            container.appendChild(card);
        });
    }


    function goBack(e) {
        e.preventDefault();
        if (document.referrer && history.length > 1) { history.back(); return; }
        const r = localStorage.getItem('user_role');
        location.href = (r === 'admin' || r === 'servant') ? 'servant-dashboard.html' : 'student.html';
    }

    function setTodayDate() {
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('synaxDateInput').value = todayStr;
        fetchSynaxariumForDate(todayStr);
    }

    window.onload = setTodayDate;
</script>
</body>
</html>
