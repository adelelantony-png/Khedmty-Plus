<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة السلوك الروحي للمخدومين | خدمتي برو</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; color: #1e293b; padding-bottom: 40px; }
        .main-container { max-width: 950px; margin: 20px auto; padding: 0 15px; }
        .header-card { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); color: #fff; border-radius: 20px; padding: 22px; margin-bottom: 20px; }
        .table-card { background: #fff; border-radius: 18px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .table thead { background: #1e3a8a; color: #fff; }
        .table th, .table td { vertical-align: middle; text-align: center; padding: 12px; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="servant-dashboard.html?tab=membersTab" class="btn btn-outline-secondary btn-sm fw-bold">
            <i class="fa-solid fa-arrow-right me-1"></i> العودة لتبويب المخدومين
        </a>
        <button class="btn btn-success fw-bold px-4 shadow-sm" onclick="exportToExcel()">
            <i class="fa-solid fa-file-excel me-1"></i> تحميل شيت الإكسيل (Excel)
        </button>
    </div>

    <div class="header-card text-center">
        <h4 class="fw-bold mb-1"><i class="fa-solid fa-chart-line me-2"></i>متابعة السلوك الروحي والأكاديمي للمخدومين</h4>
        <small class="opacity-75">كشف شامل لحضور الاجتماع، قراءة الإنجيل، وسجلات النوتة الروحية</small>
    </div>

    <div class="table-card">
        <div class="table-responsive mb-0">
            <table class="table table-hover mb-0" id="followupTable">
                <thead>
                    <tr>
                        <th>كود الدارس</th>
                        <th>اسم المخدوم</th>
                        <th>الفرقة / المرحلة</th>
                        <th>حضور الجمعة</th>
                        <th>أيام النوتة المسجلة</th>
                        <th>إقراءات الإنجيل</th>
                        <th>إجمالي النقاط ⭐</th>
                    </tr>
                </thead>
                <tbody id="followupTbody">
                    <tr>
                        <td colspan="7" class="text-center py-4 text-muted">جاري تحميل بيانات المخدومين...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function loadFollowupData() {
        // سحب قائمة المخدومين المسجلين في الكلاس
        const students = JSON.parse(localStorage.getItem('my_church_class')) || [
            { code: "1000", name: "عادل جورج", stage: "سنة أولى" }
        ];

        const attendanceRecord = JSON.parse(localStorage.getItem('my_church_attendance')) || {};
        const spiritualLogs = JSON.parse(localStorage.getItem('khedmety_student_spiritual')) || {};
        const bibleReadings = JSON.parse(localStorage.getItem('khedmety_bible_readings')) || {};

        const tbody = document.getElementById('followupTbody');
        tbody.innerHTML = '';

        if (students.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">لا يوجد مخدومين مسجلين في النظام حالياً.</td></tr>';
            return;
        }

        students.forEach(st => {
            const sCode = (st.code || st.id || '').toString();
            const sName = st.name || 'مخدوم';
            const sLevel = st.stage || st.level || 'الفرقة الأولى';

            // 1. حساب حضور الجمعة
            let fridayCount = 0;
            Object.keys(attendanceRecord).forEach(dateKey => {
                const list = attendanceRecord[dateKey] || [];
                const found = list.find(a => (a.code && a.code.toString() === sCode) && !a.isAbsentDueToDelay && new Date(dateKey).getDay() === 5);
                if (found) fridayCount++;
            });

            // 2. حساب أيام النوتة الروحية المسجلة
            let spiritualDaysCount = 0;
            Object.keys(spiritualLogs).forEach(key => {
                if (key.endsWith(`_${sCode}`)) spiritualDaysCount++;
            });

            // 3. حساب أيام قراءة الكتاب المقدس
            let bibleCount = Object.keys(bibleReadings).filter(k => k.endsWith(`_${sCode}`) || String((bibleReadings[k] || {}).code || '') === sCode).length;

            // 4. إجمالي النقاط
            const totalPoints = (fridayCount * 5) + (spiritualDaysCount * 5) + (bibleCount * 2);

            tbody.innerHTML += `
                <tr>
                    <td class="fw-bold text-primary">${sCode}</td>
                    <td class="fw-bold text-dark">${sName}</td>
                    <td><span class="badge bg-light text-dark border">${sLevel}</span></td>
                    <td><span class="text-success fw-bold">${fridayCount} اجتماع</span></td>
                    <td><span class="text-danger fw-bold">${spiritualDaysCount} يوم</span></td>
                    <td><span class="text-warning text-dark fw-bold">${bibleCount} إصحاح</span></td>
                    <td><strong class="text-primary fs-6">${totalPoints} ⭐</strong></td>
                </tr>
            `;
        });
    }

    // دالة تصدير البيانات إلى شيت إكسيل (CSV / Excel format)
    function exportToExcel() {
        const table = document.getElementById("followupTable");
        let csvContent = "\uFEFF"; // لدعم الحروف العربية في الإكسيل
        
        const rows = table.querySelectorAll("tr");
        rows.forEach(row => {
            const cols = row.querySelectorAll("th, td");
            const data = Array.from(cols).map(col => `"${col.innerText}"`);
            csvContent += data.join(",") + "\n";
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Khedmety_Followup_Report_${new Date().toISOString().split('T')[0]}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    loadFollowupData();
</script>
</body>
</html>
