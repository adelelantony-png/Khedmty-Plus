<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شيتات ومواد الفرقة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; color: #334155; }
        .subject-card { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); display: flex; justify-content: space-between; align-items: center; }
        .subject-card.done { border-right: 5px solid #16a34a; background-color: #f0fdf4; }
    </style>
</head>
<body>

<div class="container py-4" style="max-width: 600px;">
    <div class="text-center mb-4">
        <h5 class="fw-bold text-primary mb-1">خدمة إعداد الخدام</h5>
        <div id="ui-level" class="badge bg-primary fs-6 px-3 py-1 mb-2">جاري التحميل...</div>
        <div class="small text-muted">الطالب: <strong id="ui-name"></strong> (كود: <span id="ui-code"></span>)</div>
    </div>

    <div class="card p-3 shadow-sm border-0 rounded-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0">المقررات والشيتات المطلوبة</h6>
            <a href="student.html" class="btn btn-outline-secondary btn-sm">الرئيسية</a>
        </div>

        <!-- سيتم حقن الشيتات هنا -->
        <div id="subjects-container">
            <div class="text-center py-4"><i class="fa-solid fa-spinner fa-spin text-primary fs-3"></i></div>
        </div>
    </div>
</div>

<script>
    const studentCode = localStorage.getItem('student_code');
    const studentName = localStorage.getItem('student_name');
    const studentLevel = localStorage.getItem('student_level');

    if (!studentCode) window.location.href = 'index.html';

    document.getElementById('ui-level').textContent = studentLevel;
    document.getElementById('ui-name').textContent = studentName;
    document.getElementById('ui-code').textContent = studentCode;

    async function loadSubjects() {
        const container = document.getElementById('subjects-container');
        try {
            const response = await fetch(`/api/get_subjects?code=${studentCode}&level=${encodeURIComponent(studentLevel)}`);
            const result = await response.json();

            if (result.success) {
                if (result.subjects.length === 0) {
                    container.innerHTML = '<div class="alert alert-info text-center">لا توجد مواد أو شيتات مضافة لفرقتك حالياً.</div>';
                    return;
                }

                container.innerHTML = '';
                result.subjects.forEach(sub => {
                    const isDone = result.submitted.includes(sub.title);
                    const attachmentHtml = sub.attachment_file ? 
                        `<a href="${sub.attachment_file}" class="text-danger small fw-bold text-decoration-none me-3" target="_blank" download>
                            <i class="fa-solid fa-file-arrow-down me-1"></i> تحميل ملخص المادة
                        </a>` : '';

                    container.innerHTML += `
                        <div class="subject-card ${isDone ? 'done' : ''}">
                            <div>
                                <div class="fw-bold fs-6 mb-1">
                                    <i class="fa-solid ${isDone ? 'fa-circle-check text-success' : 'fa-book'} me-2"></i> ${sub.title}
                                </div>
                                <div>
                                    ${attachmentHtml}
                                    <span class="badge ${isDone ? 'bg-success' : 'bg-warning text-dark'} small">
                                        ${isDone ? 'تم التسليم' : 'مطلوب حله'}
                                    </span>
                                </div>
                            </div>
                            <div>
                                <a href="sheet.html?subject=${encodeURIComponent(sub.title)}" class="btn btn-sm ${isDone ? 'btn-outline-success' : 'btn-primary'} fw-bold">
                                    ${isDone ? 'مراجعة الشيت' : 'حل الشيت'} <i class="fa-solid fa-arrow-left ms-1"></i>
                                </a>
                            </div>
                        </div>
                    `;
                });
            }
        } catch (error) {
            container.innerHTML = '<div class="alert alert-danger text-center">تعذر جلب البيانات.</div>';
        }
    }

    loadSubjects();
</script>

</body>
</html>
