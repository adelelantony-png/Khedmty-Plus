function normalizeBookName(name) {

    if (!name) return '';

    const mapped = arabicBookNames[name] || name;

    return mapped

        .replace(/^سفر\s+/, '')

        .replace(/^إنجيل\s+/, '')

        .replace(/^رسالة\s+/, '')

        .replace(/حكمة سليمان/, 'حكمة')

        .trim();

}



function getPlanItemForDate(planData, month, day) {

    if (typeof window !== 'undefined' && typeof window.getBiblePlanReading === 'function') {

        const now = new Date();

        const targetDate = (month && day) ? new Date(now.getFullYear(), month - 1, day) : now;

        const item = window.getBiblePlanReading(targetDate);

        if (item) return item;

    }

    if (!planData) return null;

    if (planData[`${month}-${day}`]) return planData[`${month}-${day}`];

    const serviceMonth = ((month - 10 + 12) % 12) + 1;

    if (planData[`${serviceMonth}-${day}`]) return planData[`${serviceMonth}-${day}`];

    const keys = Object.keys(planData);

    if (keys.length > 0) {

        const dayOfYear = Math.floor((new Date(new Date().getFullYear(), month - 1, day) - new Date(new Date().getFullYear(), 0, 0)) / 86400000);

        return planData[keys[dayOfYear % keys.length]];

    }

    return null;

}

function prepareBibleData(rawBooks) {

    if (!Array.isArray(rawBooks)) return [];

    const stripTashkeel = s => String(s ?? '').replace(/[\u064B-\u065F\u0670]/g, '');



    return rawBooks.map(book => {

        if (!book || !Array.isArray(book.chapters)) return book;



        // فحص هل يحتوي السفر على نصوص إصحاحات مدمجة في مصفوفة واحدة

        const needsSplit = book.chapters.some(chapArray => 

            Array.isArray(chapArray) && chapArray.some(line => {

                const c = stripTashkeel(String(line).trim());

                return c.startsWith('الاصحاح') || c.startsWith('الأصحاح') || c.startsWith('الأصحَاح') || c.startsWith('المزمور');

            })

        );



        if (!needsSplit) return book;



        // تقسيم الآيات تلقائياً إلى إصحاحات حقيقية

        const allLines = book.chapters.flat();

        const splitChapters = [];

        let curChapter = [];



        for (const rawLine of allLines) {

            const line = String(rawLine).trim();

            if (!line) continue;

            const clean = stripTashkeel(line);

            const isHeader = (

                clean.startsWith('الاصحاح') || clean.startsWith('الأصحاح') || clean.startsWith('الأصحَاح') ||

                clean.startsWith('المزمور') || (clean.startsWith('مزمور') && line.length < 30) ||

                clean.startsWith('سفر') || clean.startsWith('إنجيل') || clean.startsWith('رسالة')

            );



            if (clean.startsWith('الاصحاح') || clean.startsWith('الأصحاح') || clean.startsWith('الأصحَاح') ||

                clean.startsWith('المزمور') || (clean.startsWith('مزمور') && line.length < 30)) {

                if (curChapter.length > 0) {

                    splitChapters.push(curChapter);

                    curChapter = [];

                }

            } else if (!isHeader) {

                // إزالة رقم الآية من بداية النص لأن القارئ يضيفه تلقائياً

                const verseText = line.replace(/^\d+/, '').trim();

                curChapter.push(verseText);

            }

        }

        if (curChapter.length > 0) splitChapters.push(curChapter);



        return Object.assign({}, book, { chapters: splitChapters });

    });

}



async function loadBibleData() {

    if (window.BIBLE_STATIC_DATA && Array.isArray(window.BIBLE_STATIC_DATA) && window.BIBLE_STATIC_DATA.length > 0) {

        bibleData = prepareBibleData(window.BIBLE_STATIC_DATA);

        setupBooksDropdown();

        return;

    }



    try {

        const response = await fetch('./bible.json');

        if (!response.ok) throw new Error('HTTP Status ' + response.status);

        const json = await response.json();

        bibleData = prepareBibleData(json);

        setupBooksDropdown();

    } catch (err) {

        document.getElementById('versesArea').innerHTML = `

            <div class="alert alert-warning text-center" style="line-height: 1.8;">

                <strong>تعذر قراءة نصوص الكتاب المقدس:</strong><br>

                تأكد من وجود ملف <code>bible-data.js</code> أو <code>bible.json</code> في نفس المجلد.

            </div>`;

    }

}



function setupBooksDropdown() {

    const bookSelect = document.getElementById('bookSelect');

    if (!bookSelect || !bibleData.length) return;

    bookSelect.innerHTML = '';

    let selectedIndex = 0;

    const cleanTarget = normalizeBookName(targetBookName);



    bibleData.forEach((book, index) => {

        const option = document.createElement('option');

        option.value = index;

        const arName = arabicBookNames[book.name] || book.name;

        option.textContent = `${index + 1}. ${arName}`;



        if (cleanTarget) {

            const cleanAr = normalizeBookName(arName);

            if (cleanAr === cleanTarget || arName === targetBookName || book.name === targetBookName) {

                selectedIndex = index;

            }

        }

        bookSelect.appendChild(option);

    });



    bookSelect.selectedIndex = selectedIndex;

    onBookChanged(true);

}



function onBookChanged(isInitial = false) {

    const bookIndex = document.getElementById('bookSelect').value;

    const book = bibleData[bookIndex];

    if (!book) return;

    const chapterSelect = document.getElementById('chapterSelect');

    chapterSelect.innerHTML = '';



    book.chapters.forEach((_, cIdx) => {

        const option = document.createElement('option');

        option.value = cIdx;

        option.textContent = `الإصحاح ${cIdx + 1}`;

        chapterSelect.appendChild(option);

    });



    if (isInitial && targetChapter > 0 && targetChapter <= book.chapters.length) {

        chapterSelect.selectedIndex = targetChapter - 1;

    } else {

        chapterSelect.selectedIndex = 0;

    }



    renderVerses();

}



function renderVerses() {

    const bookIndex = document.getElementById('bookSelect').value;

    const chapIndex = document.getElementById('chapterSelect').value;

    const book = bibleData[bookIndex];

    if (!book) return;

    const verses = book.chapters[chapIndex] || [];

    const arName = arabicBookNames[book.name] || book.name;



    let titleText = `${arName} — الإصحاح ${parseInt(chapIndex) + 1}`;

    if (targetChapterEnd > targetChapter && normalizeBookName(arName) === normalizeBookName(targetBookName)) {

        titleText += ` (مقرر اليوم: الإصحاحات ${targetChapter} إلى ${targetChapterEnd})`;

    }

    document.getElementById('chapterHeaderTitle').textContent = titleText;



    let html = '';

    verses.forEach((vText, vIdx) => {

        html += `<span class="verse-num">${vIdx + 1}</span>${vText} `;

    });



    document.getElementById('versesArea').innerHTML = html || '<div class="text-center text-muted py-4">لا توجد آيات متوفرة لهذا الإصحاح.</div>';

    window.scrollTo({ top: 180, behavior: 'smooth' });

}



function nextChapter() {

    const chapSelect = document.getElementById('chapterSelect');

    if (chapSelect.selectedIndex < chapSelect.options.length - 1) {

        chapSelect.selectedIndex++;

        renderVerses();

    } else {

        const bookSelect = document.getElementById('bookSelect');

        if (bookSelect.selectedIndex < bookSelect.options.length - 1) {

            bookSelect.selectedIndex++;

            onBookChanged(false);

        }

    }

}



function prevChapter() {

    const chapSelect = document.getElementById('chapterSelect');

    if (chapSelect.selectedIndex > 0) {

        chapSelect.selectedIndex--;

        renderVerses();

    } else {

        const bookSelect = document.getElementById('bookSelect');

        if (bookSelect.selectedIndex > 0) {

            bookSelect.selectedIndex--;

            onBookChanged(false);

            chapSelect.selectedIndex = chapSelect.options.length - 1;

            renderVerses();

        }

    }

}



function changeFontSize(delta) {

    currentFontSize = Math.max(1, Math.min(2.2, currentFontSize + (delta * 0.15)));

    document.getElementById('versesArea').style.fontSize = `${currentFontSize}rem`;

}



async function markCurrentChapterRead() {
    if (!studentCode) {
        alert('يرجى تسجيل الدخول أولاً لحفظ قراءتك ونقاطك الروحية.');
        return;
    }

    const btnMark = document.getElementById('btnMarkRead');
    btnMark.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> جاري التسجيل...';
    btnMark.disabled = true;

    const now = new Date();
    const curMonth = now.getMonth() + 1;
    const curDay = now.getDate();
    const planKey = `${curMonth}-${curDay}_${studentCode}`;

    const bookIndex = document.getElementById('bookSelect').value;
    const chapNum = parseInt(document.getElementById('chapterSelect').value, 10) + 1;
    const book = bibleData[bookIndex];
    const bookTitle = book ? (arabicBookNames[book.name] || book.name) : (targetBookName || 'قراءة يومية');

    let localReadings = JSON.parse(localStorage.getItem('khedmety_bible_readings')) || {};
    let savedLog = localReadings[planKey] || {
        code: studentCode,
        month: curMonth,
        day: curDay,
        book: bookTitle,
        reading: bookTitle + ' ' + chapNum,
        completed_chapters: [],
        _synced: false
    };

    let completed = Array.isArray(savedLog.completed_chapters) ? [...savedLog.completed_chapters] : [];
    if (!completed.includes(chapNum)) {
        completed.push(chapNum);
    }
    completed = Array.from(new Set(completed)).sort((a, b) => a - b);

    const totalCount = (targetChapterEnd && targetChapter) ? (targetChapterEnd - targetChapter + 1) : Math.max(...completed, 1);
    const isAll = (completed.length >= totalCount && totalCount > 0);

    savedLog.code = String(studentCode);
    savedLog.name = studentName;
    savedLog.book = bookTitle;
    savedLog.chapter = chapNum;
    savedLog.completed_chapters = completed;
    savedLog.chapters_read_count = completed.length;
    savedLog.total_chapters = totalCount;
    savedLog.is_completed = isAll ? 1 : 0;
    savedLog.completed = isAll ? 1 : 0;
    savedLog.points = (completed.length * 2) + (isAll ? 3 : 0);
    savedLog._synced = false;

    localReadings[planKey] = savedLog;
    localStorage.setItem('khedmety_bible_readings', JSON.stringify(localReadings));

    if (window.AuthClient) {
        try {
            const resp = await AuthClient.fetch('/api/mark_plan_read', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    code: studentCode,
                    month: curMonth,
                    day: curDay,
                    book: bookTitle,
                    reading: bookTitle + ' ' + chapNum,
                    chapter: chapNum,
                    action: 'mark_chapter',
                    completed_chapters: completed,
                    total_chapters: totalCount
                })
            });
            if (resp.ok) {
                savedLog._synced = true;
                localReadings[planKey] = savedLog;
                localStorage.setItem('khedmety_bible_readings', JSON.stringify(localReadings));
            }
        } catch (e) {
            console.warn('API sync warning:', e);
        }
    }

    if (fsdb) {
        try {
            await fsdb.collection('students').doc(studentCode).collection('reading_logs').doc(`${curMonth}-${curDay}`).set(savedLog, { merge: true });
        } catch(e) {}
    }

    btnMark.disabled = false;
    updateReadingStatusForCurrentChapter();

    if (isAll) {
        alert('🎉 مبارك! أتممت قراءة جميع إصحاحات اليوم بنجاح وحصلت على بونص الأمانة (+3 نقاط)! ✝️');
    }
}


function selectChapterInReader(bookName, chapterNum) {
    const bookSelect = document.getElementById('bookSelect');
    const chapterSelect = document.getElementById('chapterSelect');
    if (!bookSelect || !chapterSelect || !bibleData || !bibleData.length) return;

    const cleanTarget = normalizeBookName(bookName);
    let foundIndex = -1;
    bibleData.forEach((b, idx) => {
        const arName = arabicBookNames[b.name] || b.name;
        if (normalizeBookName(arName) === cleanTarget || arName === bookName || b.name === bookName) {
            foundIndex = idx;
        }
    });

    if (foundIndex !== -1) {
        bookSelect.selectedIndex = foundIndex;
        onBookChanged(false);
        if (chapterNum > 0 && chapterNum <= chapterSelect.options.length) {
            chapterSelect.selectedIndex = chapterNum - 1;
            renderVerses();
        }
    }
}

function renderPlanBannerChapters(planItem, curMonth, curDay) {
    const grid = document.getElementById('planBannerChaptersGrid');
    const summaryBadge = document.getElementById('planBannerSummaryBadge');
    const completionAlert = document.getElementById('planBannerCompletionAlert');
    if (!grid) return;
    grid.innerHTML = '';

    if (!planItem) {
        if (summaryBadge) summaryBadge.textContent = 'قراءة حرة وتأمل يومي';
        return;
    }

    const startChap = planItem.chapter || 1;
    const endChap = planItem.chapter_end || startChap;
    const totalCount = (endChap - startChap + 1);

    const planKey = `${curMonth}-${curDay}_${studentCode}`;
    const localReadings = JSON.parse(localStorage.getItem('khedmety_bible_readings')) || {};
    const savedLog = localReadings[planKey] || localReadings[`${curMonth}-${curDay}`] || {};

    let completed = Array.isArray(savedLog.completed_chapters) ? [...savedLog.completed_chapters] : [];
    if (completed.length === 0 && (savedLog.completed || savedLog.is_completed)) {
        for (let c = startChap; c <= endChap; c++) completed.push(c);
    }

    const readCount = completed.length;
    const isAll = (readCount >= totalCount && totalCount > 0);

    if (summaryBadge) {
        if (isAll) {
            summaryBadge.innerHTML = '<i class="fa-solid fa-circle-check text-success me-1"></i> أتممت اليوم كاملاً (100%)';
            summaryBadge.className = 'badge bg-success text-white px-3 py-2 fw-bold';
        } else {
            const percent = totalCount > 0 ? Math.round((readCount / totalCount) * 100) : 0;
            summaryBadge.innerHTML = `أتممت ${readCount} من ${totalCount} إصحاحات (${percent}%)`;
            summaryBadge.className = 'badge bg-light text-dark border border-warning px-3 py-2 fw-bold';
        }
    }

    if (completionAlert) {
        if (isAll) completionAlert.classList.remove('d-none');
        else completionAlert.classList.add('d-none');
    }

    for (let c = startChap; c <= endChap; c++) {
        const isRead = completed.includes(c);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `btn btn-sm d-inline-flex align-items-center gap-2 px-3 py-2 ${isRead ? 'btn-success text-white' : 'btn-outline-dark bg-white'}`;
        btn.style.borderRadius = '12px';
        btn.style.fontWeight = '700';
        btn.style.fontSize = '0.85rem';
        btn.style.boxShadow = '0 2px 4px rgba(0,0,0,0.04)';
        btn.style.cursor = 'pointer';

        btn.innerHTML = `
            <span>${isRead ? '<i class="fa-solid fa-circle-check"></i>' : '<i class="fa-regular fa-circle"></i>'}</span>
            <span>إصحاح ${c}</span>
            <span class="badge ${isRead ? 'bg-light text-success' : 'bg-warning text-dark'} ms-1" style="font-size:0.75rem;">
                ${isRead ? 'تم ✔️' : '+2 نقطة'}
            </span>
        `;

        btn.onclick = async () => {
            selectChapterInReader(planItem.book, c);
            await toggleChapterFromBanner(planItem, curMonth, curDay, c);
        };

        grid.appendChild(btn);
    }
}

async function toggleChapterFromBanner(planItem, curMonth, curDay, chapterNum) {
    if (!studentCode) {
        alert('يرجى تسجيل الدخول أولاً لحفظ قراءتك ونقاطك الروحية.');
        return;
    }

    const startChap = planItem.chapter || 1;
    const endChap = planItem.chapter_end || startChap;
    const totalCount = (endChap - startChap + 1);

    const planKey = `${curMonth}-${curDay}_${studentCode}`;
    const localReadings = JSON.parse(localStorage.getItem('khedmety_bible_readings')) || {};
    let savedLog = localReadings[planKey] || {
        code: studentCode,
        month: curMonth,
        day: curDay,
        book: planItem.book,
        reading: planItem.reading,
        completed_chapters: [],
        _synced: false
    };

    let completed = Array.isArray(savedLog.completed_chapters) ? [...savedLog.completed_chapters] : [];
    if (completed.length === 0 && (savedLog.completed || savedLog.is_completed)) {
        for (let c = startChap; c <= endChap; c++) completed.push(c);
    }

    if (completed.includes(chapterNum)) {
        completed = completed.filter(c => c !== chapterNum);
    } else {
        completed.push(chapterNum);
    }
    completed = Array.from(new Set(completed)).sort((a,b)=>a-b);

    const isAll = (completed.length >= totalCount && totalCount > 0);
    savedLog.code = String(studentCode);
    savedLog.month = curMonth;
    savedLog.day = curDay;
    savedLog.book = planItem.book;
    savedLog.reading = planItem.reading;
    savedLog.completed_chapters = completed;
    savedLog.chapters_read_count = completed.length;
    savedLog.total_chapters = totalCount;
    savedLog.is_completed = isAll ? 1 : 0;
    savedLog.completed = isAll ? 1 : 0;
    savedLog.points = (completed.length * 2) + (isAll ? 3 : 0);
    savedLog._synced = false;

    localReadings[planKey] = savedLog;
    localStorage.setItem('khedmety_bible_readings', JSON.stringify(localReadings));

    renderPlanBannerChapters(planItem, curMonth, curDay);
    updateReadingStatusForCurrentChapter();

    try {
        const fetchFn = window.AuthClient ? AuthClient.fetch.bind(AuthClient) : fetch;
        const resp = await fetchFn('/api/mark_plan_read', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                code: studentCode,
                month: curMonth,
                day: curDay,
                book: planItem.book,
                reading: planItem.reading,
                chapter: chapterNum,
                action: 'toggle_chapter',
                completed_chapters: completed,
                total_chapters: totalCount
            })
        });
        if (resp.ok) {
            savedLog._synced = true;
            localReadings[planKey] = savedLog;
            localStorage.setItem('khedmety_bible_readings', JSON.stringify(localReadings));
        } else {
            throw new Error('Offline API');
        }
    } catch (e) {
        if (window.KhedmtyOfflineSync) {
            KhedmtyOfflineSync.enqueue('MARK_PLAN_READ', {
                code: studentCode,
                month: curMonth,
                day: curDay,
                book: planItem.book,
                reading: planItem.reading,
                chapter: chapterNum,
                action: 'toggle_chapter',
                completed_chapters: completed,
                total_chapters: totalCount
            }, { dedupKey: `${curMonth}-${curDay}_${studentCode}` });
        }
    }

    if (isAll) {
        alert('🎉 مبارك! أتممت قراءة جميع إصحاحات اليوم بالكامل وحصلت على بونص الأمانة (+3 نقاط)! ✝️');
    }
}

function updateReadingStatusForCurrentChapter() {
    const btnMark = document.getElementById('btnMarkRead');
    if (!btnMark) return;
    const chapIndex = document.getElementById('chapterSelect')?.value;
    if (chapIndex === undefined || chapIndex === null) return;
    const chapNum = parseInt(chapIndex, 10) + 1;

    const now = new Date();
    const curMonth = now.getMonth() + 1;
    const curDay = now.getDate();
    const planKey = `${curMonth}-${curDay}_${studentCode}`;

    const localReadings = JSON.parse(localStorage.getItem('khedmety_bible_readings')) || {};
    const savedLog = localReadings[planKey] || localReadings[`${curMonth}-${curDay}`] || {};

    let completed = Array.isArray(savedLog.completed_chapters) ? savedLog.completed_chapters : [];
    if (completed.length === 0 && (savedLog.completed || savedLog.is_completed)) {
        completed = [chapNum];
    }

    const isRead = completed.includes(chapNum);
    if (isRead) {
        btnMark.className = 'btn btn-outline-success fw-bold px-4 py-2 shadow-sm rounded-pill';
        btnMark.innerHTML = `<i class="fa-solid fa-circle-check me-1"></i> أتممت قراءة إصحاح ${chapNum} بنجاح ✔️`;
    } else {
        btnMark.className = 'btn btn-success fw-bold px-4 py-2 shadow-sm rounded-pill';
        btnMark.innerHTML = `<i class="fa-solid fa-check me-1"></i> سجّل قراءة إصحاح ${chapNum} (+2 نقطة ⭐)`;
    }
}

};

function handleBibleBack(e) {

    if (e && typeof e.preventDefault === 'function') e.preventDefault();

    try {

        const urlParams = new URLSearchParams(window.location.search);

        const fromParam = urlParams.get('from') || urlParams.get('fromTab');

        const groupParam = urlParams.get('group');

        const userRole = (window.AuthClient && typeof AuthClient.getUserRole === 'function' && AuthClient.getUserRole()) ||

                         (typeof currentUser !== 'undefined' && currentUser && currentUser.role) ||

                         localStorage.getItem('user_role') ||

                         sessionStorage.getItem('khedmety_role') || '';

        const isServant = fromParam === 'servant' || groupParam === 'spirit' || userRole === 'servant' || userRole === 'admin' || userRole === 'developer';



        if (fromParam === 'spiritual_note') {

            window.location.href = 'spiritual_note.html';

            return;

        }

        if (isServant) {

            window.location.href = 'servant-dashboard.html?group=spirit';

            return;

        }

        if (window.AuthClient && typeof AuthClient.navigateBack === 'function') {

            AuthClient.navigateBack('student.html', e);

        } else {

            window.location.href = 'student.html';

        }

    } catch (err) {

        window.location.href = 'servant-dashboard.html?group=spirit';

    }

}

window.handleBibleBack = handleBibleBack;
