function normalizeBookName(name) {
    if (!name) return '';
    const mapped = arabicBookNames[name] || name;
    return mapped
        .replace(/^سفر\s+/, '')
        .replace(/^إنجيل\s+/, '')
        .replace(/^رسالة\s+/, '')
        .replace(/حكمة سليمان/, 'حكمة')
        .trim();
}

function getPlanItemForDate(planData, month, day) {
    if (typeof window !== 'undefined' && typeof window.getBiblePlanReading === 'function') {
        const now = new Date();
        const targetDate = (month && day) ? new Date(now.getFullYear(), month - 1, day) : now;
        const item = window.getBiblePlanReading(targetDate);
        if (item) return item;
    }
    if (!planData) return null;
    if (planData[`${month}-${day}`]) return planData[`${month}-${day}`];
    const serviceMonth = ((month - 10 + 12) % 12) + 1;
    if (planData[`${serviceMonth}-${day}`]) return planData[`${serviceMonth}-${day}`];
    const keys = Object.keys(planData);
    if (keys.length > 0) {
        const dayOfYear = Math.floor((new Date(new Date().getFullYear(), month - 1, day) - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
        return planData[keys[dayOfYear % keys.length]];
    }
    return null;
}

function prepareBibleData(rawBooks) {
    if (!Array.isArray(rawBooks)) return [];
    const stripTashkeel = s => String(s ?? '').replace(/[\u064B-\u065F\u0670]/g, '');

    return rawBooks.map(book => {
        if (!book || !Array.isArray(book.chapters)) return book;

        // فحص هل يحتوي السفر على نصوص إصحاحات مدمجة في مصفوفة واحدة
        const needsSplit = book.chapters.some(chapArray => 
            Array.isArray(chapArray) && chapArray.some(line => {
                const c = stripTashkeel(String(line).trim());
                return c.startsWith('الاصحاح') || c.startsWith('الأصحاح') || c.startsWith('الأصحَاح') || c.startsWith('المزمور');
            })
        );

        if (!needsSplit) return book;

        // تقسيم الآيات تلقائياً إلى إصحاحات حقيقية
        const allLines = book.chapters.flat();
        const splitChapters = [];
        let curChapter = [];

        for (const rawLine of allLines) {
            const line = String(rawLine).trim();
            if (!line) continue;
            const clean = stripTashkeel(line);
            const isHeader = (
                clean.startsWith('الاصحاح') || clean.startsWith('الأصحاح') || clean.startsWith('الأصحَاح') ||
                clean.startsWith('المزمور') || (clean.startsWith('مزمور') && line.length < 30) ||
                clean.startsWith('سفر') || clean.startsWith('إنجيل') || clean.startsWith('رسالة')
            );

            if (clean.startsWith('الاصحاح') || clean.startsWith('الأصحاح') || clean.startsWith('الأصحَاح') ||
                clean.startsWith('المزمور') || (clean.startsWith('مزمور') && line.length < 30)) {
                if (curChapter.length > 0) {
                    splitChapters.push(curChapter);
                    curChapter = [];
                }
            } else if (!isHeader) {
                // إزالة رقم الآية من بداية النص لأن القارئ يضيفه تلقائياً
                const verseText = line.replace(/^\d+/, '').trim();
                curChapter.push(verseText);
            }
        }
        if (curChapter.length > 0) splitChapters.push(curChapter);

        return Object.assign({}, book, { chapters: splitChapters });
    });
}

async function loadBibleData() {
    if (window.BIBLE_STATIC_DATA && Array.isArray(window.BIBLE_STATIC_DATA) && window.BIBLE_STATIC_DATA.length > 0) {
        bibleData = prepareBibleData(window.BIBLE_STATIC_DATA);
        setupBooksDropdown();
        return;
    }

    try {
        const response = await fetch('./bible.json');
        if (!response.ok) throw new Error('HTTP Status ' + response.status);
        const json = await response.json();
        bibleData = prepareBibleData(json);
        setupBooksDropdown();
    } catch (err) {
        document.getElementById('versesArea').innerHTML = `
            <div class="alert alert-warning text-center" style="line-height: 1.8;">
                <strong>تعذر قراءة نصوص الكتاب المقدس:</strong><br>
                تأكد من وجود ملف <code>bible-data.js</code> أو <code>bible.json</code> في نفس المجلد.
            </div>`;
    }
}

function setupBooksDropdown() {
    const bookSelect = document.getElementById('bookSelect');
    if (!bookSelect || !bibleData.length) return;
    bookSelect.innerHTML = '';
    let selectedIndex = 0;
    const cleanTarget = normalizeBookName(targetBookName);

    bibleData.forEach((book, index) => {
        const option = document.createElement('option');
        option.value = index;
        const arName = arabicBookNames[book.name] || book.name;
        option.textContent = `${index + 1}. ${arName}`;

        if (cleanTarget) {
            const cleanAr = normalizeBookName(arName);
            if (cleanAr === cleanTarget || arName === targetBookName || book.name === targetBookName) {
                selectedIndex = index;
            }
        }
        bookSelect.appendChild(option);
    });

    bookSelect.selectedIndex = selectedIndex;
    onBookChanged(true);
}

function onBookChanged(isInitial = false) {
    const bookIndex = document.getElementById('bookSelect').value;
    const book = bibleData[bookIndex];
    if (!book) return;
    const chapterSelect = document.getElementById('chapterSelect');
    chapterSelect.innerHTML = '';

    book.chapters.forEach((_, cIdx) => {
        const option = document.createElement('option');
        option.value = cIdx;
        option.textContent = `الإصحاح ${cIdx + 1}`;
        chapterSelect.appendChild(option);
    });

    if (isInitial && targetChapter > 0 && targetChapter <= book.chapters.length) {
        chapterSelect.selectedIndex = targetChapter - 1;
    } else {
        chapterSelect.selectedIndex = 0;
    }

    renderVerses();
}

function renderVerses() {
    const bookIndex = document.getElementById('bookSelect').value;
    const chapIndex = document.getElementById('chapterSelect').value;
    const book = bibleData[bookIndex];
    if (!book) return;
    const verses = book.chapters[chapIndex] || [];
    const arName = arabicBookNames[book.name] || book.name;

    let titleText = `${arName} — الإصحاح ${parseInt(chapIndex) + 1}`;
    if (targetChapterEnd > targetChapter && normalizeBookName(arName) === normalizeBookName(targetBookName)) {
        titleText += ` (مقرر اليوم: الإصحاحات ${targetChapter} إلى ${targetChapterEnd})`;
    }
    document.getElementById('chapterHeaderTitle').textContent = titleText;

    let html = '';
    verses.forEach((vText, vIdx) => {
        html += `<span class="verse-num">${vIdx + 1}</span>${vText} `;
    });

    document.getElementById('versesArea').innerHTML = html || '<div class="text-center text-muted py-4">لا توجد آيات متوفرة لهذا الإصحاح.</div>';
    window.scrollTo({ top: 180, behavior: 'smooth' });
}

function nextChapter() {
    const chapSelect = document.getElementById('chapterSelect');
    if (chapSelect.selectedIndex < chapSelect.options.length - 1) {
        chapSelect.selectedIndex++;
        renderVerses();
    } else {
        const bookSelect = document.getElementById('bookSelect');
        if (bookSelect.selectedIndex < bookSelect.options.length - 1) {
            bookSelect.selectedIndex++;
            onBookChanged(false);
        }
    }
}

function prevChapter() {
    const chapSelect = document.getElementById('chapterSelect');
    if (chapSelect.selectedIndex > 0) {
        chapSelect.selectedIndex--;
        renderVerses();
    } else {
        const bookSelect = document.getElementById('bookSelect');
        if (bookSelect.selectedIndex > 0) {
            bookSelect.selectedIndex--;
            onBookChanged(false);
            chapSelect.selectedIndex = chapSelect.options.length - 1;
            renderVerses();
        }
    }
}

function changeFontSize(delta) {
    currentFontSize = Math.max(1, Math.min(2.2, currentFontSize + (delta * 0.15)));
    document.getElementById('versesArea').style.fontSize = `${currentFontSize}rem`;
}

    const now = new Date();

    const curDay = now.getDate();

    const bookIndex = document.getElementById('bookSelect').value;
    const chapNum = parseInt(document.getElementById('chapterSelect').value) + 1;
    const book = bibleData[bookIndex];
    const bookTitle = book ? (arabicBookNames[book.name] || book.name) : (targetBookName || 'قراءة يومية');

    const recordData = {
        code: String(studentCode),
        name: studentName,
        book: bookTitle,
        chapter: chapNum,
        planKey: planKey,
        date: now.toISOString(),
        completed: 1,
        points: 5,
        _synced: false
    };

    // 1. حفظ محلي فوري (أوفلاين)
    let localReadings = JSON.parse(localStorage.getItem('khedmety_bible_readings')) || {};
    localReadings[`${planKey}_${studentCode}`] = recordData;
    localStorage.setItem('khedmety_bible_readings', JSON.stringify(localReadings));

    // 2. تسجيل سحابي موثق عبر API
    if (window.AuthClient) {
        try {
            const resp = await AuthClient.fetch('/api/mark_plan_read', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    code: studentCode,
                    month: curMonth,
                    day: curDay,
                    reading: bookTitle + ' ' + chapNum
                })
            });
            if (resp.ok) {
                recordData._synced = true;
                localReadings[`${planKey}_${studentCode}`] = recordData;
                localStorage.setItem('khedmety_bible_readings', JSON.stringify(localReadings));
            }
        } catch (apiErr) {
            console.warn("API mark_plan_read warning, saving directly if online:", apiErr);
        }
    }

    // 3. حفظ إضافي مباشر في Firestore كنسخة احتياطية
    try {
        await fsdb.collection('students').doc(studentCode).collection('reading_logs').doc(planKey).set(recordData, { merge: true });
    } catch (e) {
        console.warn("Cloud reading log warning:", e);
    }

    btnMark.className = 'btn btn-outline-success fw-bold px-3 py-2';
    btnMark.innerHTML = '<i class="fa-solid fa-check-double me-1"></i> أتممت قراءة اليوم بنجاح (+5 نقاط ⭐)';
    btnMark.disabled = false;
}

window.onload = async function() {
    await detectTodayPlan();
    await loadBibleData();
};

function handleBibleBack(e) {
    if (e && typeof e.preventDefault === 'function') e.preventDefault();
    try {
        const urlParams = new URLSearchParams(window.location.search);
        const fromParam = urlParams.get('from') || urlParams.get('fromTab');
        const groupParam = urlParams.get('group');
        const userRole = (window.AuthClient && typeof AuthClient.getUserRole === 'function' && AuthClient.getUserRole()) ||
                         (typeof currentUser !== 'undefined' && currentUser && currentUser.role) ||
                         localStorage.getItem('user_role') ||
                         sessionStorage.getItem('khedmety_role') || '';
        const isServant = fromParam === 'servant' || groupParam === 'spirit' || userRole === 'servant' || userRole === 'admin' || userRole === 'developer';

        if (fromParam === 'spiritual_note') {
            window.location.href = 'spiritual_note.html';
            return;
        }
        if (isServant) {
            window.location.href = 'servant-dashboard.html?group=spirit';
            return;
        }
        if (window.AuthClient && typeof AuthClient.navigateBack === 'function') {
            AuthClient.navigateBack('student.html', e);
        } else {
            window.location.href = 'student.html';
        }
    } catch (err) {
        window.location.href = 'servant-dashboard.html?group=spirit';
    }
}
window.handleBibleBack = handleBibleBack;

// ضبط مسار العودة الذكي بناءً على دور المستخدم أو سياق الوصول
(function () {
    try {
        const urlParams = new URLSearchParams(window.location.search);
        const fromParam = urlParams.get('from') || urlParams.get('fromTab');
        const groupParam = urlParams.get('group');
        const userRole = (window.AuthClient && typeof AuthClient.getUserRole === 'function' && AuthClient.getUserRole()) ||
                         (typeof currentUser !== 'undefined' && currentUser && currentUser.role) ||
                         localStorage.getItem('user_role') ||
                         sessionStorage.getItem('khedmety_role') || '';
        const isServant = fromParam === 'servant' || groupParam === 'spirit' || userRole === 'servant' || userRole === 'admin' || userRole === 'developer';
        const smartBackBtn = document.querySelector('[data-smart-back]');
        if (smartBackBtn) {
            if (fromParam === 'spiritual_note') {
                smartBackBtn.setAttribute('data-fallback', 'spiritual_note.html');
            } else if (isServant) {
                smartBackBtn.setAttribute('data-fallback', 'servant-dashboard.html?group=spirit');
            } else {
                smartBackBtn.setAttribute('data-fallback', 'student.html');
            }
        }
    } catch (e) {
        console.warn('تعذر ضبط مسار العودة الذكي:', e);
    }
})();
</script>
