<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النوتة الروحية للخادم - وسائط النعمة</title>
    <meta name="theme-color" content="#1e3799">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/app-theme.css">
    <style>
        body { 
            font-family: 'Tajawal', sans-serif; 
            background-color: #f1f5f9; 
            color: #1e293b; 
        }

        /* 📱 التكيف الديناميكي للحاوية الرئيسية حسب حجم الشاشة */
        .main-container { 
            width: 100%;
            max-width: 1200px; 
            margin: 20px auto; 
            padding: 0 16px; 
            transition: all 0.3s ease;
        }

        @media (max-width: 767px) {
            .main-container { max-width: 100%; padding: 0 12px; margin: 10px auto; }
            .header-card { padding: 16px 12px; border-radius: 16px; }
            .card-custom { padding: 16px 12px; border-radius: 16px; }
        }

        @media (min-width: 768px) and (max-width: 1023px) {
            .main-container { max-width: 92%; padding: 0 18px; margin: 18px auto; }
        }

        @media (min-width: 1024px) {
            .main-container { max-width: 1180px; padding: 0 24px; margin: 24px auto; }
            .card-custom { padding: 28px 24px; }
            .header-card { padding: 24px 20px; }
        }

        @media (min-width: 1400px) {
            .main-container { max-width: 1280px; padding: 0 28px; margin: 30px auto; }
        }

        .card-custom { 
            background: #ffffff; 
            border-radius: 20px; 
            padding: 24px; 
            border: none; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.04); 
            margin-bottom: 20px; 
        }

        .header-card { 
            background: linear-gradient(135deg, #b91c1c 0%, #ef4444 100%); 
            color: #ffffff; 
            border-radius: 20px; 
            padding: 22px; 
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.22); 
            margin-bottom: 20px; 
        }

        /* شبكة الكروت التفاعلية للصلوات والأسرار */
        .pills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .check-pill { 
            display: flex; 
            align-items: center; 
            background: #f8fafc; 
            border: 2px solid #e2e8f0; 
            border-radius: 14px; 
            padding: 14px 16px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            margin-bottom: 0;
            user-select: none;
            min-height: 64px;
        }

        .check-pill:hover { 
            background: #f1f5f9; 
            border-color: #cbd5e1; 
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .check-pill input { 
            width: 22px; 
            height: 22px; 
            margin-left: 12px; 
            cursor: pointer; 
            flex: none; 
        }

        .check-pill:has(input:checked) { 
            background: #fef2f2; 
            border-color: #fca5a5; 
            box-shadow: 0 2px 8px rgba(239,68,68,0.12);
        }

        .group-label { 
            font-size: 0.92rem; 
            font-weight: 800; 
            color: #1e3799; 
            margin-bottom: 10px; 
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .spiritual-section-box {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            padding: 18px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="main-container pb-5" id="app" style="display:none;">

    <!-- شريط التنقل -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <button type="button" class="btn btn-outline-secondary btn-sm fw-bold btn-smart-back" data-smart-back data-fallback="servant-dashboard.html?tab=dashTab">
            <i class="fa-solid fa-arrow-right me-1"></i> العودة للوحة الخدمة
        </button>
        <span class="badge bg-danger px-3 py-2 fw-bold">نوتة الخادم الروحية 🕊️</span>
    </div>

    <!-- الترويسة -->
    <div class="header-card text-center">
        <h4 class="fw-bold mb-1"><i class="fa-solid fa-heart-pulse me-2"></i>خلوة ونوتة الخادم اليومية</h4>
        <small id="ui-servant-info" class="opacity-90 d-block mb-2">جاري التحميل...</small>
        <div class="bg-white bg-opacity-20 rounded-pill py-1 px-3 d-inline-block small">
            «أَمَّا أَنَا فَبِكَثْرَةِ رَحْمَتِكَ أَدْخُلُ بَيْتَكَ، أَسْجُدُ فِي هَيْكَلِ قُدْسِكَ بِخَوْفِكَ»
        </div>
    </div>

    <!-- رسائل النظام -->
    <div id="system-msg" class="alert d-none fw-bold text-center" role="alert"></div>

    <div class="card card-custom">
        <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
            <h5 class="fw-bold text-danger mb-0 d-flex align-items-center gap-2">
                <i class="fa-solid fa-calendar-check"></i> تسجيل وسائط النعمة لليوم
            </h5>
            <span class="badge bg-light text-secondary border px-3 py-2 fw-bold d-none d-md-inline-block">
                متابعة الخادم اليومية
            </span>
        </div>

        <form id="servant-spiritual-form">
            <div class="row g-4">
                <!-- العمود الأيمن (الخلوة والكلمة المقدسة وحفظ اليوم) -->
                <div class="col-12 col-lg-5">
                    <div class="spiritual-section-box">
                        <div>
                            <!-- اختيار اليوم -->
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted d-block">
                                    <i class="fa-solid fa-calendar-day text-danger me-1"></i> اختر اليوم للمتابعة أو التسجيل:
                                </label>
                                <input type="date" id="target_date" class="form-control text-center fw-bold form-control-lg border-2" required onchange="onDateChanged(this.value)">
                            </div>

                            <!-- الكلمة المقدسة والخلوة -->
                            <span class="group-label">
                                <i class="fa-solid fa-book-bible text-primary me-1"></i> الكلمة المقدسة والخلوة:
                            </span>
                            <label class="check-pill mb-3">
                                <input type="checkbox" id="bible_reading">
                                <div>
                                    <strong class="d-block text-dark"><i class="fa-solid fa-book-open-reader text-primary me-1"></i> قراءة الأصحاح المخصص</strong>
                                    <small class="text-muted">من الإنجيل اليومي وخطة القراءة السنوية</small>
                                </div>
                            </label>

                            <div class="mb-3">
                                <label class="form-label small text-muted fw-bold" for="s_bible_note">
                                    <i class="fa-solid fa-pen-nib text-secondary me-1"></i> تدوين آية أو تأمل سري من خلوتك:
                                </label>
                                <textarea id="s_bible_note" class="form-control" rows="5" placeholder="اكتب آية لمست قلبك اليوم وتأمل في رسالتها لخدمتك..."></textarea>
                            </div>
                        </div>

                        <!-- زر الحفظ -->
                        <button type="submit" id="save-btn" class="btn btn-danger w-100 py-3 fw-bold mt-3 shadow-sm" style="font-size: 1.05rem; border-radius: 12px;">
                            <i class="fa-solid fa-floppy-disk me-1"></i> حفظ تسجيل هذا اليوم
                        </button>
                    </div>
                </div>

                <!-- العمود الأيسر (صلوات الأجبية والأسرار والجهاد) -->
                <div class="col-12 col-lg-7">
                    <div class="spiritual-section-box">
                        <!-- الأجبية -->
                        <span class="group-label">
                            <i class="fa-solid fa-hands-praying text-primary me-1"></i> صلوات الأجبية اليومية:
                        </span>
                        <div class="pills-grid">
                            <label class="check-pill">
                                <input type="checkbox" id="prayed_baker">
                                <div><strong class="d-block text-dark"><i class="fa-solid fa-sun text-warning me-1"></i> صلاة باكر</strong><small class="text-muted">مزامير وإنجيل وطلبة باكر</small></div>
                            </label>
                            <label class="check-pill">
                                <input type="checkbox" id="prayed_saasaa">
                                <div><strong class="d-block text-dark"><i class="fa-solid fa-clock text-secondary me-1"></i> الساعة 3 و 6</strong><small class="text-muted">صلوات النهار</small></div>
                            </label>
                            <label class="check-pill">
                                <input type="checkbox" id="prayed_ghoroub">
                                <div><strong class="d-block text-dark"><i class="fa-solid fa-cloud-sun text-info me-1"></i> صلاة الغروب</strong><small class="text-muted">الساعة الحادية عشرة</small></div>
                            </label>
                            <label class="check-pill">
                                <input type="checkbox" id="prayed_noam">
                                <div><strong class="d-block text-dark"><i class="fa-solid fa-moon text-primary me-1"></i> صلاة النوم</strong><small class="text-muted">الساعة الثانية عشرة</small></div>
                            </label>
                        </div>

                        <!-- الأسرار والجهاد -->
                        <span class="group-label mt-2">
                            <i class="fa-solid fa-shield-heart text-danger me-1"></i> الأسرار والجهاد الروحي:
                        </span>
                        <div class="pills-grid">
                            <label class="check-pill">
                                <input type="checkbox" id="attended_mass">
                                <div><strong class="d-block text-dark"><i class="fa-solid fa-church text-success me-1"></i> حضور القداس والتناول</strong><small class="text-muted">سر الإفخارستيا</small></div>
                            </label>
                            <label class="check-pill">
                                <input type="checkbox" id="fasting">
                                <div><strong class="d-block text-dark"><i class="fa-solid fa-utensils text-danger me-1"></i> الصوم الانقطاعي</strong><small class="text-muted">حسب تقويم الكنيسة أو النذر</small></div>
                            </label>
                            <label class="check-pill">
                                <input type="checkbox" id="s_confession">
                                <div><strong class="d-block text-dark"><i class="fa-solid fa-dove text-primary me-1"></i> جلسة الاعتراف</strong><small class="text-muted">الاعتراف مع أب الاعتراف</small></div>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<script src="auth-client.js"></script>
<script src="bible_plan.js"></script>
<script>
(function () {
    'use strict';

    if (window.AuthClient) {
        if (!AuthClient.enforceAuth(['servant', 'admin'])) return;
    }

    // ---------- الهوية: نفس جلسة بوابة الدخول (index.html) ----------
    function getCurrentServant() {
        try {
            const u = JSON.parse(localStorage.getItem('my_church_active_user') || sessionStorage.getItem('my_church_active_user'));
            return (u && (u.role === 'admin' || u.role === 'servant' || u.permission)) ? u : null;
        } catch (e) { return null; }
    }
    const me = getCurrentServant();
    if (!me || (me.role !== 'admin' && me.role !== 'servant')) { location.replace('index.html'); return; }

    const servantCode = String(me.code || me.id || 'servant');
    const STORE = 'khedmety_servant_spiritual_detailed';
    const $ = id => document.getElementById(id);

    $('app').style.display = '';
    $('ui-servant-info').textContent = `${me.name || 'الخادم'} (كود: ${servantCode})`;

    // تاريخ محلي (وليس UTC) حتى لا يتأخر اليوم فجراً
    const dateKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const today = dateKey(new Date());
    $('target_date').value = today;

    const readJSON = (k) => { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch (e) { return {}; } };

    // ---------- خطة القراءة والتعويض ----------
    const FALLBACK = {
        "10-1": { reading: "سفر يونان (1 إلى 4)", book: "يونان", chapter: 1, chapter_end: 4 },
        "10-2": { reading: "سفر ميخا (1 إلى 3)", book: "ميخا", chapter: 1, chapter_end: 3 },
        "10-3": { reading: "سفر ميخا (4 إلى 7)", book: "ميخا", chapter: 4, chapter_end: 7 },
        "10-4": { reading: "سفر ناحوم (1 إلى 3)", book: "ناحوم", chapter: 1, chapter_end: 3 },
        "10-5": { reading: "سفر حبقوق (1 إلى 3)", book: "حبقوق", chapter: 1, chapter_end: 3 },
        "10-6": { reading: "سفر صفنيا (1 إلى 3)", book: "صفنيا", chapter: 1, chapter_end: 3 },
        "10-7": { reading: "سفر حجي (1 إلى 2)", book: "حجي", chapter: 1, chapter_end: 2 }
    };
    let planCache = window.BIBLE_PLAN_DATA || null;

    async function getPlan() {
        if (planCache) return planCache;
        try {
            const res = await fetch('bible_plan.json');
            if (res.ok) planCache = await res.json();
        } catch (e) { /* نكمل بالخطة الاحتياطية */ }
        return planCache || {};
    }

    // فحص صامت (بلا واجهة) لمعرفة هل قراءة إنجيل اليوم مُنجزة مسبقاً، ليُعلَّم مربع الاختيار تلقائياً
    function isBibleAlreadyRead(selectedDate) {
        const d = new Date(selectedDate + 'T00:00:00');
        const planKey = `${d.getMonth() + 1}-${d.getDate()}`;
        const readings = readJSON('khedmety_bible_readings');
        const userReadings = (readings[servantCode] && readings[servantCode].completed_plans) || [];
        if (userReadings.includes(planKey)) return true;

        const dynReadings = (readings[servantCode] && readings[servantCode].completed_dynamic_days) || [];
        if (window.getBiblePlanDayNumber) {
            const dayNum = window.getBiblePlanDayNumber(d);
            if (dayNum && dynReadings.includes(dayNum)) return true;
        }
        return false;
    }

    // ---------- التحميل والعرض حسب اليوم المختار ----------
    window.onDateChanged = function (dateVal) {
        if (!dateVal) return;
        const all = readJSON(STORE);
        const userDay = (all[servantCode] && all[servantCode][dateVal]) || {};

        const fields = ['bible_reading', 'prayed_baker', 'prayed_saasaa', 'prayed_ghoroub', 'prayed_noam', 'attended_mass', 'fasting', 's_confession'];
        fields.forEach(f => {
            const el = $(f);
            if (el) el.checked = Boolean(userDay[f]);
        });

        // إذا لم يكن الإنجيل مُعلَّماً، نفحص هل قراءة اليوم مسجلة في خطة القراءة العامة
        if ($('bible_reading') && !$('bible_reading').checked) {
            if (isBibleAlreadyRead(dateVal)) $('bible_reading').checked = true;
        }

        // استرجاع التأمل/الآية
        if ($('s_bible_note')) {
            const reflections = readJSON('khedmety_self_reflections');
            const userRef = (reflections[servantCode] && reflections[servantCode][dateVal]) || {};
            $('s_bible_note').value = userRef.reflection || userDay.bible_note || '';
        }

        hideMsg();
    };

    function showMsg(text, type) {
        const el = $('system-msg');
        el.className = `alert alert-${type} fw-bold text-center`;
        el.textContent = text;
        el.classList.remove('d-none');
    }
    function hideMsg() { $('system-msg').classList.add('d-none'); }

    // ---------- الحفظ ----------
    $('servant-spiritual-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const dateVal = $('target_date').value;
        if (!dateVal) { showMsg('يرجى اختيار تاريخ أولاً.', 'warning'); return; }

        const btn = $('save-btn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> جاري الحفظ...';

        try {
            // 1. تجميع بيانات النوتة التفصيلية
            const fields = ['bible_reading', 'prayed_baker', 'prayed_saasaa', 'prayed_ghoroub', 'prayed_noam', 'attended_mass', 'fasting', 's_confession'];
            const entry = { updated_at: new Date().toISOString() };
            fields.forEach(f => { entry[f] = $(f) ? $(f).checked : false; });
            entry.bible_note = $('s_bible_note') ? $('s_bible_note').value.trim() : '';

            const allDetailed = readJSON(STORE);
            if (!allDetailed[servantCode]) allDetailed[servantCode] = {};
            allDetailed[servantCode][dateVal] = entry;
            localStorage.setItem(STORE, JSON.stringify(allDetailed));

            // 2. تحديث سجل النوتة الروحية العام المتوافق (khedmety_servant_spiritual) لدعم لوحة المتابعة
            const legacyStore = 'khedmety_servant_spiritual';
            const allLegacy = readJSON(legacyStore);
            if (!allLegacy[servantCode]) allLegacy[servantCode] = {};
            allLegacy[servantCode][dateVal] = {
                bible: entry.bible_reading,
                agpeya: Boolean(entry.prayed_baker || entry.prayed_saasaa || entry.prayed_ghoroub || entry.prayed_noam),
                mass: entry.attended_mass,
                fasting: entry.fasting,
                confession: entry.s_confession,
                timestamp: Date.now()
            };
            localStorage.setItem(legacyStore, JSON.stringify(allLegacy));

            // 3. حفظ الآية/التأمل في سجل التأملات المنفصل khedmety_self_reflections
            if (entry.bible_note) {
                const reflections = readJSON('khedmety_self_reflections');
                if (!reflections[servantCode]) reflections[servantCode] = {};
                reflections[servantCode][dateVal] = {
                    date: dateVal,
                    reflection: entry.bible_note,
                    timestamp: new Date().toISOString()
                };
                localStorage.setItem('khedmety_self_reflections', JSON.stringify(reflections));
            }

            // 4. إذا علَّم على قراءة الإنجيل اليوم، نسجلها في خطة القراءة السنوية
            if (entry.bible_reading) {
                const plan = await getPlan();
                const d = new Date(dateVal + 'T00:00:00');
                const planKey = `${d.getMonth() + 1}-${d.getDate()}`;
                const todayPlan = plan[planKey] || FALLBACK[planKey];
                const readings = readJSON('khedmety_bible_readings');
                if (!readings[servantCode]) readings[servantCode] = { completed_plans: [], completed_dynamic_days: [] };
                if (!readings[servantCode].completed_plans.includes(planKey)) readings[servantCode].completed_plans.push(planKey);

                if (window.getBiblePlanDayNumber) {
                    const dayNum = window.getBiblePlanDayNumber(d);
                    if (dayNum && !readings[servantCode].completed_dynamic_days.includes(dayNum)) {
                        readings[servantCode].completed_dynamic_days.push(dayNum);
                    }
                }
                readings[servantCode].last_read_date = dateVal;
                readings[servantCode].last_plan_title = todayPlan ? todayPlan.reading : 'قراءة اليوم';
                localStorage.setItem('khedmety_bible_readings', JSON.stringify(readings));
            }

            // 5. محاولة المزامنة مع السيرفر/Firestore إن وُجد اتصال
            if (window.AuthClient && AuthClient.isOnline && AuthClient.isOnline()) {
                fetch('/api/spiritual_note', {
                    method: 'POST',
                    headers: AuthClient.getAuthHeader({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({
                        date: dateVal,
                        user_code: servantCode,
                        data: entry
                    })
                }).catch(() => { /* نكتفي بالمحلي إن تعذر السيرفر */ });
            }

            showMsg('✅ تم حفظ وسائط النعمة لهذا اليوم بنجاح وربطها بسجلاتك الروحية المباركة!', 'success');
        } catch (err) {
            console.error('Error saving spiritual note:', err);
            showMsg('حدث خطأ أثناء الحفظ محلياً: ' + err.message, 'danger');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i> حفظ تسجيل هذا اليوم';
        }
    });

    // بدء التحميل لأول مرة
    window.onDateChanged(today);
})();
</script>

</body>
</html>
