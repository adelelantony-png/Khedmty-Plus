<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حصاد الخادم - الإنجاز والمتابعة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .main-container { max-width: 650px; margin: 20px auto; padding: 0 15px; }
        .harvest-header { background: linear-gradient(135deg, #059669 0%, #10b981 100%); color: #ffffff; border-radius: 20px; padding: 24px; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.2); margin-bottom: 20px; }
        .stat-card { background-color: #ffffff; border-radius: 18px; padding: 18px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 16px; }
        .progress-custom { height: 10px; border-radius: 6px; background-color: #e2e8f0; }
        .stat-icon { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
    </style>
</head>
<body>

<div class="main-container pb-5">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="student.html" class="btn btn-outline-secondary btn-sm fw-bold"><i class="fa-solid fa-arrow-right me-1"></i> العودة للرئيسية</a>
        <span id="ui-level" class="badge bg-primary px-3 py-2"></span>
    </div>

    <div class="harvest-header text-center">
        <div class="stat-icon bg-white text-success mx-auto mb-2 shadow-sm"><i class="fa-solid fa-seedling"></i></div>
        <h4 class="fw-bold mb-1">حصاد جهادك الروحي والتعليمي</h4>
        <div id="ui-student-info" class="small opacity-90 mb-3">جاري التحميل...</div>
    </div>

    <div id="loading-spinner" class="text-center py-4"><i class="fa-solid fa-spinner fa-spin text-success fs-3"></i></div>

    <div id="stats-container" class="d-none">
        <!-- النقاط -->
        <div class="stat-card d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <div class="stat-icon bg-warning bg-opacity-25 text-warning me-3"><i class="fa-solid fa-trophy"></i></div>
                <div><h6 class="fw-bold mb-0 text-dark">نقاط النشاط والتفاعل</h6><small class="text-muted">مجموع درجات الحضور والتفاعل</small></div>
            </div>
            <div><span id="stat-points" class="fs-4 fw-bold text-primary">0</span> <small class="text-muted">نقطة</small></div>
        </div>

        <!-- الكتاب المقدس -->
        <div class="stat-card">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div class="d-flex align-items-center">
                    <div class="stat-icon bg-primary bg-opacity-10 text-primary me-3"><i class="fa-solid fa-book-bible"></i></div>
                    <div><h6 class="fw-bold mb-0">ختم الكتاب المقدس</h6><small id="stat-bible-text" class="text-muted"></small></div>
                </div>
                <span id="stat-bible-badge" class="badge bg-primary fs-6">0%</span>
            </div>
            <div class="progress progress-custom mt-2">
                <div id="stat-bible-bar" class="progress-bar bg-primary" role="progressbar" style="width: 0%"></div>
            </div>
        </div>

        <!-- الشيتات -->
        <div class="stat-card">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div class="d-flex align-items-center">
                    <div class="stat-icon bg-success bg-opacity-10 text-success me-3"><i class="fa-solid fa-file-circle-check"></i></div>
                    <div><h6 class="fw-bold mb-0">شيتات المقررات المسلّمة</h6><small id="stat-sheets-text" class="text-muted"></small></div>
                </div>
                <span id="stat-sheets-badge" class="badge bg-success fs-6">0%</span>
            </div>
            <div class="progress progress-custom mt-2">
                <div id="stat-sheets-bar" class="progress-bar bg-success" role="progressbar" style="width: 0%"></div>
            </div>
        </div>

        <!-- النوتة الروحية -->
        <div class="stat-card">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <div class="stat-icon bg-danger bg-opacity-10 text-danger me-3"><i class="fa-solid fa-heart-pulse"></i></div>
                    <div><h6 class="fw-bold mb-0">سجلات وسائط النعمة</h6><small class="text-muted">الأيام الروحية المسجلة</small></div>
                </div>
                <span id="stat-spiritual-badge" class="badge bg-danger fs-6">0 يوم مسجل</span>
            </div>
            <div class="mt-3 text-end">
                <a href="spiritual_note.html" class="btn btn-outline-danger btn-sm fw-bold"><i class="fa-solid fa-pen-to-square me-1"></i> فتح النوتة الروحية</a>
            </div>
        </div>
    </div>

</div>

<script>
    const studentCode = localStorage.getItem('student_code');
    const studentName = localStorage.getItem('student_name') || 'المخدوم';
    const studentLevel = localStorage.getItem('student_level') || 'الفرقة الأولى';

    if (!studentCode) window.location.href = 'index.html';

    // 1. ترحيل وتحديث قراءات الكتاب المقدس القديمة لتتطابق مع النظام الجديد (مرة واحدة)
    (function migrateLegacyBible(){
        try {
            var c = localStorage.getItem('student_code');
            if (!c) return;
            var r = JSON.parse(localStorage.getItem('khedmety_bible_readings')) || {};
            var changed = false;
            
            // قاموس التصحيح للأسماء القديمة
            var nameCorrections = {
                "1 مكابيين": "المكابيين الأول",
                "مكابيين 1": "المكابيين الأول",
                "2 مكابيين": "المكابيين الثاني",
                "مكابيين 2": "المكابيين الثاني",
                "1 صموئيل": "صموئيل الأول",
                "2 صموئيل": "صموئيل الثاني",
                "1 ملوك": "الملوك الأول",
                "2 ملوك": "الملوك الثاني",
                "1 أخبار أيام": "أخبار الأيام الأول",
                "2 أخبار أيام": "أخبار الأيام الثاني"
            };

            Object.keys(r).forEach(function(k){
                var item = r[k];
                var nk = k;

                if (/^\d{1,2}-\d{1,2}$/.test(k)) {
                    nk = k + '_' + c;
                    if (!r[nk]) r[nk] = Object.assign({code: String(c)}, item);
                    delete r[k];
                    changed = true;
                    item = r[nk];
                }

                if (item && item.book) {
                    var cleanBook = item.book.replace(/^سفر\s+/, '').replace(/^إنجيل\s+/, '').trim();
                    
                    if (nameCorrections[cleanBook]) {
                        item.book = nameCorrections[cleanBook];
                        changed = true;
                    } 
                    else if (cleanBook === "مكابيين الأول" || cleanBook === "مكابيين الثاني") {
                        item.book = cleanBook.replace("مكابيين", "المكابيين");
                        changed = true;
                    }
                }
            });

            if (changed) {
                localStorage.setItem('khedmety_bible_readings', JSON.stringify(r));
            }
        } catch(e) {}
    })();

    document.getElementById('ui-level').textContent = studentLevel;
    document.getElementById('ui-student-info').textContent = `${studentName} (كود: ${studentCode})`;

    async function loadHarvest() {
        // 2. حساب الحصاد محلياً دائماً
        function calculateLocalHarvest() {
            const attendanceRecord = JSON.parse(localStorage.getItem('my_church_attendance')) || {};
            let attendancePoints = 0;
            Object.keys(attendanceRecord).forEach(dateKey => {
                const list = attendanceRecord[dateKey] || [];
                const myRecord = list.find(a => (a.code && a.code.toString() === studentCode) || (a.id && a.id.toString() === studentCode));
                if (myRecord && !myRecord.isAbsentDueToDelay) {
                    attendancePoints += (myRecord.points || 5);
                }
            });

            const localSpiritual = JSON.parse(localStorage.getItem('khedmety_student_spiritual')) || {};
            let spiritualCount = 0;
            Object.keys(localSpiritual).forEach(key => {
                if (key.endsWith(`_${studentCode}`)) spiritualCount++;
            });

            const bibleReadings = JSON.parse(localStorage.getItem('khedmety_bible_readings')) || {};
            let bibleCount = 0;
            Object.keys(bibleReadings).forEach(k => {
                const item = bibleReadings[k];
                if (k.endsWith(`_${studentCode}`) || String(item.code || '') === String(studentCode)) {
                    bibleCount++;
                }
            });

            const submittedSheetsMap = JSON.parse(localStorage.getItem('khedmety_submitted_sheets')) || {};
            const submittedSheetsList = submittedSheetsMap[studentCode] || [];
            const submittedSheets = submittedSheetsList.length;

            return {
                attendancePoints: attendancePoints,
                spiritualCount: spiritualCount,
                bibleCount: bibleCount,
                submittedSheets: submittedSheets,
                totalPlanDays: 366, // الخطة السنوية
                totalSubjects: 7
            };
        }

        const localData = calculateLocalHarvest();

        try {
            const response = await fetch(`/api/harvest?code=${encodeURIComponent(studentCode)}&level=${encodeURIComponent(studentLevel)}`);
            if (!response.ok) throw new Error('Server not available');
            const result = await response.json();

            if (result.success) {
                const sData = result.data || {};
                
                // 3. الدمج الذكي: أخذ القيمة الأكبر بين السيرفر والبيانات المحلية
                const mergedBibleCount = Math.max(sData.bibleCount || 0, localData.bibleCount);
                const mergedSpiritualCount = Math.max(sData.spiritualCount || 0, localData.spiritualCount);
                const mergedSheets = Math.max(sData.submittedSheets || 0, localData.submittedSheets);
                const mergedAttendancePoints = Math.max(sData.attendancePoints || 0, localData.attendancePoints);

                // إعادة حساب النقاط الإجمالية بدقة بعد الدمج (كل قراءة بـ 5 نقاط)
                const mergedPoints = mergedAttendancePoints + (mergedSpiritualCount * 5) + (mergedBibleCount * 5);

                const finalData = {
                    points: Math.max(sData.points || 0, mergedPoints),
                    bibleCount: mergedBibleCount,
                    totalPlanDays: sData.totalPlanDays || 366,
                    submittedSheets: mergedSheets,
                    totalSubjects: sData.totalSubjects || 7,
                    spiritualCount: mergedSpiritualCount
                };
                
                renderHarvestUI(finalData);
            } else {
                throw new Error(result.message);
            }
        } catch (error) {
            console.warn("تعذر الاتصال بالخادم، تم الاعتماد على الحساب المحلي:", error);
            // حساب النقاط الكلية للمحلي في حالة فشل السيرفر تماماً
            localData.points = localData.attendancePoints + (localData.spiritualCount * 5) + (localData.bibleCount * 5);
            renderHarvestUI(localData);
        }
    }

    function renderHarvestUI(data) {
        document.getElementById('stat-points').textContent = data.points;

        const biblePercent = data.totalPlanDays > 0 ? Math.min(100, Math.round((data.bibleCount / data.totalPlanDays) * 100)) : 0;
        document.getElementById('stat-bible-text').textContent = `أتممت ${data.bibleCount} من أصل ${data.totalPlanDays} يوماً`;
        document.getElementById('stat-bible-badge').textContent = `${biblePercent}%`;
        document.getElementById('stat-bible-bar').style.width = `${biblePercent}%`;

        const sheetsPercent = data.totalSubjects > 0 ? Math.min(100, Math.round((data.submittedSheets / data.totalSubjects) * 100)) : 0;
        document.getElementById('stat-sheets-text').textContent = `سلمت ${data.submittedSheets} من أصل ${data.totalSubjects} شيتات مطلوبة`;
        document.getElementById('stat-sheets-badge').textContent = `${sheetsPercent}%`;
        document.getElementById('stat-sheets-bar').style.width = `${sheetsPercent}%`;

        const noteBadge = document.getElementById('stat-spiritual-badge');
        noteBadge.textContent = `${data.spiritualCount} يوم مسجل`;
        if (data.spiritualCount > 0) {
            noteBadge.classList.replace('bg-danger', 'bg-success');
        }

        document.getElementById('loading-spinner').classList.add('d-none');
        document.getElementById('stats-container').classList.remove('d-none');
    }

    loadHarvest();
</script>

</body>
</html>
