<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة استعلام النتائج الرسمية - اجتماع إعداد الخدام</title>
  <link rel="icon" type="image/png" href="icons/favicon-48.png">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f3f6fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #frameContainer {
      width: 100%;
      height: 100%;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f3f6fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.3s ease;
      color: #0a2540;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top-color: #0a2540;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="frameContainer">
    <div id="loader" class="loading-overlay">
      <div class="spinner"></div>
      <div style="font-weight: 700; font-size: 15px;">جاري فتح بوابة استعلام النتائج...</div>
    </div>
    <iframe id="portalFrame" src="" allow="clipboard-write" onload="document.getElementById('loader').style.display='none'"></iframe>
  </div>

  <script>
    // تمرير كود الطالب تلقائياً إن كان مسجلاً بالمتصفح أو بالرابط
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code') || localStorage.getItem('student_code') || '';
    const baseScriptUrl = 'https://script.google.com/macros/s/AKfycbxjeNo0JH8WQWyHvEW2qRLo6utNdM9WUFfxcGo8YtHB83V5w9Nfhv_iuGBEfiZQOKhc/exec';
    
    const targetUrl = code ? `${baseScriptUrl}?code=${encodeURIComponent(code)}` : baseScriptUrl;
    document.getElementById('portalFrame').src = targetUrl;
  </script>
</body>
</html>
