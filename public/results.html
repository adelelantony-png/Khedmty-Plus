<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة استعلام النتائج الرسمية - اجتماع إعداد الخدام</title>
  <meta name="theme-color" content="#1e3799">
  <link rel="icon" type="image/png" href="icons/favicon-48.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/app-theme.css">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="auth-client.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8fafc;
      font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #frameContainer {
      width: 100%;
      height: 100%;
      position: relative;
    }
    .top-floating-bar {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-smart-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.95);
      color: #1e293b;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 8px 16px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(8px);
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-smart-back:hover {
      background: #1e3a8a;
      color: #fff;
      border-color: #1e3a8a;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.3s ease;
      color: #0f172a;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top-color: #1e3a8a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="top-floating-bar">
    <button type="button" class="btn-smart-back" id="backBtn" data-smart-back data-fallback="student.html">
      <i class="fa-solid fa-arrow-right"></i> العودة
    </button>
  </div>

  <div id="frameContainer">
    <div id="loader" class="loading-overlay">
      <div class="spinner"></div>
      <div style="font-weight: 700; font-size: 15px;">جاري فتح بوابة استعلام النتائج الرسمية...</div>
    </div>
    <iframe id="portalFrame" src="" allow="clipboard-write" onload="document.getElementById('loader').style.display='none'"></iframe>
  </div>

  <script>
    'use strict';

    // 1. فرض تسجيل الدخول ومنع الدخول المجهول
    if (window.AuthClient) {
      AuthClient.enforceAuth(['student', 'servant', 'admin']);
    }

    // 2. استخراج بيانات المستخدم
    const currentUser = window.AuthClient ? AuthClient.getUser() : null;
    const userRole = (currentUser && currentUser.role) || localStorage.getItem('user_role') || 'student';
    const userCode = (window.AuthClient && AuthClient.getUserCode()) || (currentUser && (currentUser.code || currentUser.exam_code)) || localStorage.getItem('student_code') || '';

    // ضبط وجهة الرجوع حسب الدور
    const backBtn = document.getElementById('backBtn');
    if (backBtn) {
      if (userRole === 'admin' || userRole === 'servant') {
        backBtn.setAttribute('data-fallback', 'servant-dashboard.html?tab=coursesTab&group=study');
      } else {
        backBtn.setAttribute('data-fallback', 'student.html');
      }
    }

    // 3. تحديد كود الاستعلام مع حماية الخصوصية الصارمة
    const urlParams = new URLSearchParams(window.location.search);
    let targetCode = urlParams.get('code') || userCode;

    // حظر التطفل: الطالب لا يستعلم إلا عن نتيجته هو فقط
    if (userRole === 'student') {
      targetCode = userCode;
    }

    const baseScriptUrl = 'https://script.google.com/macros/s/AKfycbxjeNo0JH8WQWyHvEW2qRLo6utNdM9WUFfxcGo8YtHB83V5w9Nfhv_iuGBEfiZQOKhc/exec';
    const targetUrl = targetCode ? `${baseScriptUrl}?code=${encodeURIComponent(targetCode)}` : baseScriptUrl;
    document.getElementById('portalFrame').src = targetUrl;
  </script>
</body>
</html>
