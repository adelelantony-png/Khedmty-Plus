<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - متابعة الأداء والخدمة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة قراءة ملفات الإكسيل داخل المتصفح -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .card-custom { border-radius: 18px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
        .nav-tabs .nav-link { font-weight: 700; color: #64748b; border: none; border-bottom: 3px solid transparent; }
        .nav-tabs .nav-link.active { color: #1e3c72; border-bottom: 3px solid #1e3c72; background: transparent; }
    </style>
</head>
<body>

<div class="container py-4" style="max-width: 1050px;">

    <!-- الشريط العلوي -->
    <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded-4 shadow-sm">
        <div>
            <h4 class="fw-bold mb-1 text-primary"><i class="fa-solid fa-screwdriver-wrench me-2"></i>لوحة تحكم الخادم المسؤول</h4>
            <small class="text-muted">متابعة وسحب أداء المخدومين، الشيتات، وضبط الخدمة</small>
        </div>
        <div>
            <a href="servant-dashboard.html" class="btn btn-outline-primary btn-sm fw-bold me-1"><i class="fa-solid fa-home me-1"></i> الرئيسية</a>
            <a href="logout.html" class="btn btn-outline-danger btn-sm fw-bold"><i class="fa-solid fa-power-off me-1"></i> خروج</a>
        </div>
    </div>

    <!-- رسائل النظام -->
    <div id="sys-msg" class="alert d-none fw-bold text-center" role="alert"></div>

    <!-- تبويبات لوحة التحكم -->
    <ul class="nav nav-tabs mb-4 bg-white p-2 rounded-4 shadow-sm" id="adminTabs" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#importTab"><i class="fa-solid fa-file-excel me-1"></i> سحب داتا الإكسيل</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#subjectsTab"><i class="fa-solid fa-book-bookmark me-1"></i> إضافة المقررات</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#settingsTab"><i class="fa-solid fa-calendar-days text-primary me-1"></i> مواعيد الخدمة</button>
        </li>
    </ul>

    <div class="tab-content">
        <!-- تبويب 1: سحب داتا الإكسيل -->
        <div class="tab-pane fade show active" id="importTab">
            <div class="card card-custom p-4 bg-white">
                <h5 class="fw-bold mb-2 text-success"><i class="fa-solid fa-cloud-arrow-up me-2"></i> استيراد ملف إكسيل (.xlsx)</h5>
                <p class="text-muted small mb-4">يجب أن يحتوي الإكسيل على الأعمدة (الاسم، التليفون، أب الاعتراف، الكود) بالترتيب.</p>

                <form id="import-form" class="bg-light p-4 rounded-4 border">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">الفرقة المستهدفة للطلاب:</label>
                            <select id="import_level" class="form-select" required>
                                <option value="الفرقة الأولى">الفرقة الأولى</option>
                                <option value="الفرقة الثانية">الفرقة الثانية</option>
                                <option value="الفرقة الثالثة">الفرقة الثالثة</option>
                                <option value="الفرقة الرابعة">الفرقة الرابعة</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">اختر ملف الإكسيل:</label>
                            <input type="file" id="excel_file" class="form-control" accept=".xlsx,.xls,.csv" required>
                        </div>
                        <div class="col-12 mt-4 text-center">
                            <button type="submit" id="btn-import" class="btn btn-success px-5 py-2 fw-bold">
                                <i class="fa-solid fa-file-import me-1"></i> سحب وإدخال البيانات
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- تبويب 2: إدارة المقررات -->
        <div class="tab-pane fade" id="subjectsTab">
            <div class="card card-custom p-4 bg-white mb-4">
                <h5 class="fw-bold mb-3 text-secondary"><i class="fa-solid fa-plus-circle me-1"></i> إضافة مقرر وشيت لفرقة دراسية</h5>
                <form id="subject-form">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">الفرقة المستهدفة:</label>
                            <select id="sub_level" class="form-select" required>
                                <option value="الفرقة الأولى">الفرقة الأولى</option>
                                <option value="الفرقة الثانية">الفرقة الثانية</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">اسم المادة:</label>
                            <input type="text" id="sub_title" class="form-control" placeholder="مثال: عقيدة أرثوذكسية" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">رابط الشيت / الامتحان:</label>
                            <input type="text" id="sub_sheet" class="form-control" placeholder="رابط جوجل فورم أو sheet.html" required>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label small fw-bold">رابط ملخص المادة (Drive Link - اختياري):</label>
                            <input type="url" id="sub_attach" class="form-control" placeholder="https://drive.google.com/...">
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button type="submit" id="btn-add-sub" class="btn btn-primary w-100 py-2 fw-bold">
                                <i class="fa-solid fa-floppy-disk me-1"></i> حفظ المادة والشيت
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- تبويب 3: ضبط السنة الخدمية -->
        <div class="tab-pane fade" id="settingsTab">
            <div class="card card-custom p-4 bg-white">
                <h5 class="fw-bold mb-3 text-primary"><i class="fa-solid fa-clock-rotate-left me-2"></i>تحديد موعد السنة الخدمية</h5>
                <form id="settings-form" class="bg-light p-4 rounded-4 border">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">اسم دورة الخدمة:</label>
                            <input type="text" id="set_name" class="form-control" value="سنة إعداد الخدام" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">تاريخ البداية:</label>
                            <input type="date" id="set_start" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">تاريخ النهاية:</label>
                            <input type="date" id="set_end" class="form-control" required>
                        </div>
                        <div class="col-12 mt-4 text-center">
                            <button type="submit" id="btn-set" class="btn btn-primary px-5 py-2 fw-bold">حفظ المواعيد</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // حماية الصفحة والتأكد أن من يدخل هو الأدمن فقط
    if (localStorage.getItem('user_role') !== 'admin') window.location.href = 'index.html';

    function showMessage(msg, isSuccess) {
        const msgBox = document.getElementById('sys-msg');
        msgBox.className = `alert fw-bold text-center alert-${isSuccess ? 'success' : 'danger'}`;
        msgBox.textContent = msg;
        msgBox.classList.remove('d-none');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function sendAdminRequest(action, payload, btnId, defaultText) {
        const btn = document.getElementById(btnId);
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري المعالجة...';
        btn.disabled = true;

        try {
            const response = await fetch('/api/admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action, payload })
            });
            const result = await response.json();
            showMessage(result.message, result.success);
        } catch (error) {
            showMessage("حدث خطأ في الاتصال بالسيرفر.", false);
        }

        btn.innerHTML = defaultText;
        btn.disabled = false;
    }

    // 1. استيراد الإكسيل
    document.getElementById('import-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const fileReader = new FileReader();
        const file = document.getElementById('excel_file').files[0];
        const level = document.getElementById('import_level').value;

        fileReader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const sheetName = workbook.SheetNames[0];
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {header: 1});
            
            let students = [];
            // تجاهل الصف الأول (العناوين) والبدء من 1
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (row && row[9]) { // الكود في العمود العاشر (index 9) بناء على كود PHP القديم
                    students.push({
                        name: row[0],
                        phone: row[3],
                        confession_father: row[8],
                        code: row[9],
                        level: level
                    });
                }
            }
            sendAdminRequest('import_students', { students, import_level: level }, 'btn-import', '<i class="fa-solid fa-file-import me-1"></i> سحب وإدخال البيانات');
        };
        fileReader.readAsArrayBuffer(file);
    });

    // 2. إضافة مقرر
    document.getElementById('subject-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const payload = {
            level: document.getElementById('sub_level').value,
            title: document.getElementById('sub_title').value,
            sheet_url: document.getElementById('sub_sheet').value,
            attachment_file: document.getElementById('sub_attach').value
        };
        sendAdminRequest('add_subject', payload, 'btn-add-sub', '<i class="fa-solid fa-floppy-disk me-1"></i> حفظ المادة والشيت');
    });

    // 3. حفظ الإعدادات
    document.getElementById('settings-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const payload = {
            service_year_name: document.getElementById('set_name').value,
            start_date: document.getElementById('set_start').value,
            end_date: document.getElementById('set_end').value
        };
        sendAdminRequest('save_settings', payload, 'btn-set', 'حفظ المواعيد');
    });
</script>
</body>
</html>
